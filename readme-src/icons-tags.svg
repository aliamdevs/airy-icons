<svg fill="none" viewBox="0 0 400 400" width="400" height="400" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aliamdevs/airy-icons@latest/css/airy.css" />
            <style>
                .thething {
                    width: 100%;
                    display: flex;
                    justify-content: space-around;
                    align-items: center;
                    flex-wrap: wrap;
                    box-sizing: border-box;
                    column-gap: 30px;
                    padding: 20px;
                    row-gap: 20px;
                }

                .thething i {
                    font-size: 30px;
                    color: white;
                    opacity: 0.5;
                    animation: ZOOMIN_OUT 2s ease-in-out infinite;
                }

                @keyframes ZOOMIN_OUT {
                    0% {
                        scale: 1;
                    }

                    50% {
                        scale: 1.3;
                    }

                    100% {
                        scale: 1;
                    }
                }
            </style>
            <div class="thething">
                <i class="airy-add-circle"></i>
                <i class="airy-add"></i>
